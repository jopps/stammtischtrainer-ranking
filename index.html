<meta charset="utf-8">
<title>Stammtischtrainer Ranking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="sst-style">
/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,h4,p,figure,blockquote,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
html{-webkit-text-size-adjust:100%}

/* ---------- tokens: light ---------- */
:root{
  --bg:#EAEDE8; --bg-2:#DFE4DC;
  --panel:#FFFFFF; --panel-2:#F4F7F2; --panel-3:#ECF0E9;
  --line:#C9D2C4; --line-soft:#DCE3D7;
  --ink:#141A16; --ink-2:#4C5751; --ink-3:#79857D;
  --brand:#CE2B37; --brand-soft:#FBE4E5; --on-brand:#FFFFFF;
  --gold:#9A6E10; --gold-bg:#F7E8C4; --gold-line:#DCBA6A;
  --royal:#57419B; --royal-bg:#E6DFF8; --royal-line:#B3A2E4;
  --grow:#2A7149; --grow-bg:#D7ECDE; --grow-line:#8CC5A2;
  --ok:#2A7149; --ok-bg:#D7ECDE;
  --shadow:0 1px 2px rgba(20,26,22,.06),0 8px 24px -12px rgba(20,26,22,.22);
  --shadow-lg:0 24px 60px -20px rgba(20,26,22,.38);
  --r:10px; --r-lg:16px;
  --rank-top:#17293A; --rank-a:#C08A12; --rank-b:#F0A81B; --rank-last:#C4441C;
  --display:"Barlow Condensed","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* ---------- tokens: dark ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --bg-2:#121917;
    --panel:#171F1B; --panel-2:#1C2521; --panel-3:#212B26;
    --line:#2C3A33; --line-soft:#242F29;
    --ink:#E9EEE8; --ink-2:#A8B5AD; --ink-3:#7B8981;
    --brand:#F4615A; --brand-soft:#3A1A1C; --on-brand:#1A0E0F;
    --gold:#E5B85E; --gold-bg:#3A2D11; --gold-line:#6B5320;
    --royal:#AF9BF5; --royal-bg:#241D44; --royal-line:#443879;
    --grow:#67C692; --grow-bg:#14301F; --grow-line:#2C6042;
    --ok:#67C692; --ok-bg:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
    --rank-top:#2E4C66;   /* auf dunklem Grund braucht das Navy mehr Helligkeit */
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --bg-2:#121917;
  --panel:#171F1B; --panel-2:#1C2521; --panel-3:#212B26;
  --line:#2C3A33; --line-soft:#242F29;
  --ink:#E9EEE8; --ink-2:#A8B5AD; --ink-3:#7B8981;
  --brand:#F4615A; --brand-soft:#3A1A1C; --on-brand:#1A0E0F;
  --gold:#E5B85E; --gold-bg:#3A2D11; --gold-line:#6B5320;
  --royal:#AF9BF5; --royal-bg:#241D44; --royal-line:#443879;
  --grow:#67C692; --grow-bg:#14301F; --grow-line:#2C6042;
  --ok:#67C692; --ok-bg:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  --rank-top:#2E4C66;
}

/* ---------- base ---------- */
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02;text-wrap:balance;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 14px}}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:18px;height:62px}
.mark{display:flex;align-items:baseline;gap:0;cursor:pointer;flex:0 0 auto}
.mark .m3{margin-left:9px}
.mark .m1{font-family:var(--display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.02em}
.mark .m2{font-family:var(--display);font-weight:600;font-size:25px;text-transform:uppercase;color:var(--brand);letter-spacing:.02em}
.mark .m3{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);padding-left:2px}
@media (max-width:720px){.mark .m3{display:none}}
.top-nav{display:flex;gap:2px;margin-left:6px}
.top-nav button{
  font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);padding:6px 11px;border-radius:8px;
}
.top-nav button:hover{color:var(--ink);background:var(--panel-2)}
.top-nav button[aria-current="page"]{color:var(--ink);background:var(--panel);box-shadow:var(--shadow)}
.top-sp{flex:1}
.whoami{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.whoami .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
@media (max-width:820px){.whoami .lbl{display:none}}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{
  font-family:var(--display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  padding:4px 14px;border-radius:99px;color:var(--ink-2);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.seg.seg-lg button{font-size:17px;padding:7px 20px}

/* ---------- banners / toast ---------- */
.banner{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);background:var(--panel-2);
  border-radius:var(--r);padding:11px 14px;margin-top:16px;font-size:13.5px;color:var(--ink-2);
}
.banner.warn{border-color:var(--gold-line);background:var(--gold-bg);color:var(--ink)}
.banner b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);z-index:90;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);transition:transform .28s cubic-bezier(.2,.8,.3,1);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--brand);color:var(--on-brand)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- page head ---------- */
.phead{padding:34px 0 22px}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-3)}
.phead h1{font-size:clamp(38px,6.4vw,60px);text-transform:uppercase;margin-top:8px}
.phead p{color:var(--ink-2);max-width:60ch;margin-top:10px;font-size:15px}
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-3);padding:4px 0}
.back:hover{color:var(--brand)}

/* ---------- overview grid ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));padding-bottom:20px}
.pcard{
  position:relative;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 16px 14px;box-shadow:var(--shadow);
  transition:transform .16s ease,border-color .16s ease;
  display:flex;flex-direction:column;gap:13px;
}
.pcard:hover{transform:translateY(-2px);border-color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}.pcard:hover{transform:none}}
.pcard .abbr{position:absolute;top:12px;right:14px;font-family:var(--display);font-weight:700;font-size:34px;
  color:var(--line-soft);letter-spacing:.02em;line-height:1}
.pcard h3{font-size:23px;text-transform:uppercase;padding-right:56px}
.pcard .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.statrow{display:flex;flex-direction:column;gap:6px}
.stat{display:flex;align-items:center;gap:8px;font-size:13.5px}
.stat .who{font-family:var(--display);font-weight:600;font-size:17px;text-transform:uppercase;width:52px;letter-spacing:.03em}
.dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
.dot.on{background:var(--ok)}
.dot.off{background:transparent;border:1.5px dashed var(--ink-3)}
.stat .txt{color:var(--ink-2);font-size:13px}
.stat .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pcard .foot{border-top:1px solid var(--line-soft);padding-top:11px;display:flex;align-items:center;gap:8px}
.kbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.kbadge.ready{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:500}

/* ---------- tabs ---------- */
.tabbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tabbar .sp{flex:1}

/* ---------- tier board ---------- */
.board{display:grid;gap:14px;padding:20px 0 40px}
@media (min-width:1000px){.board.cols{grid-template-columns:repeat(3,1fr);align-items:start}}
.tier{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tier-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);
  border-left:4px solid var(--tc,var(--line))}
.tier-head h3{font-size:20px;text-transform:uppercase;color:var(--tc)}
.tier-head .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tier.t-a{--tc:var(--gold)} .tier.t-k{--tc:var(--royal)} .tier.t-p{--tc:var(--grow)}
.tbadge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 7px;border-radius:5px}
.t-a .tbadge{background:var(--gold-bg);color:var(--gold)}
.t-k .tbadge{background:var(--royal-bg);color:var(--royal)}
.t-p .tbadge{background:var(--grow-bg);color:var(--grow)}
.tier ul{padding:6px}
.tier .empty{padding:16px 14px;color:var(--ink-3);font-size:13px;font-style:italic}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--r);background:var(--panel-2);
  border:1px solid transparent;margin-bottom:5px}
.row:last-child{margin-bottom:0}
.row.drag{cursor:grab}
.row.dragging{opacity:.38}
.row.over{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row .rk{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);width:22px;text-align:right;flex:0 0 auto}
.row .nm{min-width:0;flex:1}
.row .nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm>span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ctrl{display:flex;gap:1px;flex:0 0 auto;opacity:.55;transition:opacity .15s}
.row:hover .ctrl,.row:focus-within .ctrl{opacity:1}
@media (hover:none){.row .ctrl{opacity:1}}
.row .ctrl button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;line-height:1}
.row .ctrl button:hover{background:var(--panel-3);color:var(--ink)}
.row .ctrl button.del:hover{background:var(--brand-soft);color:var(--brand)}
.row .ctrl button[disabled]{opacity:.25;cursor:not-allowed}
.row .ctrl button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gone{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--gold);background:var(--gold-bg);
  padding:1px 5px;border-radius:4px;margin-left:6px;white-space:nowrap}

/* add / autocomplete */
.adder{position:relative;padding:6px 6px 8px}
.adder input{width:100%;background:var(--panel-3);border:1px dashed var(--line);border-radius:var(--r);
  padding:9px 11px;font-size:14px;color:var(--ink)}
.adder input::placeholder{color:var(--ink-3)}
.adder input:focus{border-style:solid;border-color:var(--ink-3);background:var(--panel-2);outline:none}
.ac{position:absolute;left:6px;right:6px;top:calc(100% - 4px);z-index:30;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:290px;overflow-y:auto;padding:4px}
.ac li{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:14px}
.ac li.sel{background:var(--panel-3)}
.ac li.no{cursor:not-allowed;opacity:.62}
.ac li b{font-weight:600}
.ac li .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto;padding-left:8px;white-space:nowrap}
.ac li .why{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:auto;white-space:nowrap}
.ac .none{padding:11px;color:var(--ink-3);font-size:13px;font-style:italic}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:8px 16px;font-size:14px;font-weight:500;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.dgr{color:var(--brand);border-color:var(--line)}
.btn.dgr:hover{background:var(--brand-soft);border-color:var(--brand)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.pri[disabled]:hover{opacity:.45}

/* ---------- sticky action bar ---------- */
.actions{position:sticky;bottom:0;z-index:35;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 0;margin-top:4px}
.actions .sp{flex:1}
.actions .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.actions .hint.dirty{color:var(--brand)}

/* ---------- consensus ---------- */
.locked{border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px 24px;text-align:center;background:var(--panel-2)}
.locked h3{font-size:24px;text-transform:uppercase;color:var(--ink-2)}
.locked p{color:var(--ink-3);font-size:14px;margin-top:8px;max-width:44ch;margin-inline:auto}
.crow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r);background:var(--panel-2);margin-bottom:5px}
.crow .rk{font-family:var(--mono);font-size:15px;font-weight:600;width:26px;text-align:right;color:var(--ink)}
.crow .nm{min-width:0;flex:1}
.crow .nm b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.crow .nm>span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.votes{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.vote{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2.5px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.vote.a{border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold)}
.vote.k{border-color:var(--royal-line);background:var(--royal-bg);color:var(--royal)}
.vote.p{border-color:var(--grow-line);background:var(--grow-bg);color:var(--grow)}
.vote.miss{border-style:dashed;color:var(--ink-3);background:transparent}
.pts{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:44px;text-align:right;flex:0 0 auto}
@media (max-width:640px){.crow{flex-wrap:wrap}.votes{width:100%;justify-content:flex-start;padding-left:37px}.pts{display:none}}

/* ---------- pool / table ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px;margin-bottom:16px}
.panel h2{font-size:22px;text-transform:uppercase;margin-bottom:4px}
.panel p.d{color:var(--ink-2);font-size:14px;max-width:64ch}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;margin-top:14px;
  transition:border-color .15s,background .15s}
.drop.hot{border-color:var(--brand);background:var(--brand-soft)}
.drop p{color:var(--ink-3);font-size:13px;margin-top:8px}
.tblwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  text-align:left;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.pos{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pos .bad{color:var(--brand)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
.filters input,.filters select{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13.5px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--ink-3)}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.kv div{display:flex;flex-direction:column}
.kv .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.kv .v{font-family:var(--display);font-size:27px;font-weight:700;line-height:1.1}
pre.code{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  font-family:var(--mono);font-size:12px;overflow-x:auto;margin-top:10px;color:var(--ink-2)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,14,12,.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  max-width:460px;width:100%;padding:22px}
.modal h3{font-size:24px;text-transform:uppercase}
.modal p{color:var(--ink-2);font-size:14px;margin-top:9px}
.modal .btns{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
/* ---------- Erhebungs-Umschalter ---------- */
.edsel{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.edsel .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.edsel select{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  font-size:13.5px;max-width:210px}
.edsel select:focus{outline:none;border-color:var(--ink-3)}
@media (max-width:900px){.edsel .lbl{display:none}.edsel select{max-width:140px}}
@media (max-width:640px){.top-in{height:auto;flex-wrap:wrap;padding:9px 0;gap:9px}.top-sp{display:none}}
.edtag{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  background:var(--panel-3);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink-2);margin-right:6px}

/* ---------- Veränderungs-Chips ---------- */
.dlt{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;flex:0 0 auto;
  letter-spacing:.02em;white-space:nowrap}
.dlt.up{background:var(--grow-bg);color:var(--grow)}
.dlt.down{background:var(--brand-soft);color:var(--brand)}
.dlt.neu{background:var(--ink);color:var(--bg)}
.dlt.same{background:transparent;color:var(--ink-3);border:1px solid var(--line-soft)}
.dropped{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 2px 0}
.dropped .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.dchip{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:99px;padding:2px 10px;text-decoration:line-through;text-decoration-color:var(--ink-3)}

/* ---------- Erhebungs-Verwaltung ---------- */
.season{padding:6px 0 14px}
.season h2{font-size:21px;text-transform:uppercase;color:var(--ink-2);padding-bottom:9px}
.edlist{display:flex;flex-direction:column;gap:9px}
.edcard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.edcard.cur{border-color:var(--ink-3);box-shadow:var(--shadow),inset 3px 0 0 var(--brand)}
.edmain{flex:1;min-width:180px}
.edmain h3{font-size:20px;text-transform:uppercase}
.edmain .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3)}
.edstats,.edacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---------- Spielerpool: Arbeitsfläche ---------- */
.selbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:9px 11px;
  border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel-2)}
.selbar.on{border-color:var(--ink-3);background:var(--panel-3)}
.selbar .cnt{font-size:12px;color:var(--ink-2);min-width:96px}
.selbar .sp{flex:1}
.selbar .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.seg.sm button{font-size:13px;padding:3px 11px}
.quickpos{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

.pool-grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr 250px;align-items:start}
@media (max-width:900px){.pool-grid{grid-template-columns:1fr}}
.pool-list{border:1px solid var(--line);border-radius:var(--r);max-height:62vh;overflow-y:auto;background:var(--panel-2)}
.pool-list ul{padding:5px}
.pool-list .empty{padding:22px 14px;color:var(--ink-3);font-size:13px;font-style:italic}
.pool-list .more{padding:9px 13px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line-soft)}
.prow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;user-select:none}
.prow:hover{background:var(--panel-3)}
.prow.on{background:var(--brand-soft);border-color:var(--brand)}
.prow.gone-row .nm b{color:var(--ink-3)}
.prow .cbx{width:19px;height:19px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:5px;
  display:grid;place-items:center;font-size:11px;color:var(--bg);background:var(--panel)}
.prow.on .cbx{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm>span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:44%}
.tagi{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:4px;margin-left:7px;
  vertical-align:middle;white-space:nowrap}
.tagi.neu{background:var(--ink);color:var(--bg)}
.tagi.weg{background:var(--brand-soft);color:var(--brand)}

.chip{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.05em;padding:2px 4px 2px 7px;border-radius:5px;background:var(--panel-3);color:var(--ink-2);
  border:1px solid var(--line-soft)}
.chip.none{padding:2px 7px;font-weight:400;color:var(--ink-3);font-style:italic;letter-spacing:0}
.chip button{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;color:var(--ink-3);
  font-size:12px;line-height:1}
.chip button:hover{background:var(--brand);color:var(--on-brand)}
.chip.p-tw,.chip.p-av,.chip.p-iv{background:var(--royal-bg);color:var(--royal);border-color:transparent}
.chip.p-zm,.chip.p-zmo{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.chip.p-fl,.chip.p-st{background:var(--grow-bg);color:var(--grow);border-color:transparent}

.bins{display:flex;flex-direction:column;gap:5px;position:sticky;top:76px}
.bins-h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);padding:0 2px 3px}
.bin{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;border-radius:var(--r);
  border:1px dashed var(--line);background:var(--panel-2);transition:background .12s,border-color .12s}
.bin:hover{border-color:var(--ink-3)}
.bin.active{border-style:solid;border-color:var(--ink-3);background:var(--panel-3)}
.bin.hot{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}
.bin .ab{font-family:var(--display);font-weight:700;font-size:17px;width:32px;flex:0 0 auto;letter-spacing:.02em}
.bin .nn{flex:1;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bin .ct{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.bin-none{opacity:.85}
.bins-hint{font-size:11.5px;color:var(--ink-3);padding:7px 2px 0;line-height:1.4}

/* ---------- Formularfelder im Dialog ---------- */
.flds{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3)}
.fld input[type="text"],.fld select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;font-size:14px;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--ink-3)}
.fld.chk{flex-direction:row;align-items:flex-start;gap:9px}
.fld.chk input{margin-top:3px;flex:0 0 auto}
.fld.chk>span{font-family:var(--body);font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink-2)}
.tlogo{width:17px;height:17px;border-radius:4px;flex:0 0 auto;display:inline-grid;place-items:center;
  background:#F1F4EF;border:1px solid rgba(20,26,22,.12);overflow:hidden}
.tlogo.on-dark{background:#101815;border-color:rgba(255,255,255,.14)}
.tlogo img{width:13px;height:13px;object-fit:contain;display:block}
.tlogo.empty{font-family:var(--mono);font-size:8px;font-weight:600;color:#5a635d;background:var(--panel-3);
  border-color:var(--line-soft);letter-spacing:.02em}
.mtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .nm>span,.prow .nm>span,.crow .nm>span{display:flex;align-items:center;gap:5px}
.ac li .tm{display:flex;align-items:center;gap:5px}
/* ---------- Rang-Boxen nach der Sendungsgrafik ---------- */
.row.boxed,.crow.boxed{padding:0 11px 0 0;gap:11px;overflow:hidden;align-items:stretch;min-height:52px}
.rankbox{align-self:stretch;width:48px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:23px;line-height:1;color:#fff;
  letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rankbox.r-top{background:var(--rank-top)}
.rankbox.r-a{background:var(--rank-a)}
.rankbox.r-b{background:var(--rank-b)}
.rankbox.r-last{background:var(--rank-last)}
.row.boxed>.tlogo,.crow.boxed>.tlogo{align-self:center}
.row.boxed .nm,.crow.boxed .nm{align-self:center}
.row.boxed .dlt,.crow.boxed .dlt{align-self:center}
.tlogo.lg{width:30px;height:30px;border-radius:6px}
.tlogo.lg img{width:24px;height:24px}
.mage{flex:0 0 auto;white-space:nowrap}
/* Adi und Fabio untereinander, damit daneben Platz fürs Alter bleibt */
.crow .votes{flex-direction:column;align-items:flex-end;gap:3px;align-self:center}
/* schmalere Wertungs-Chips, damit mehr Breite für den Klubnamen bleibt */
.crow .vote{font-size:9.5px;padding:2px 6px;letter-spacing:.02em}
.row.boxed,.crow.boxed{gap:9px}
@media (max-width:640px){
  .crow.boxed{flex-wrap:nowrap}
  .crow .votes{width:auto;justify-content:flex-start;padding-left:0}
  .rankbox{width:40px;font-size:20px}
}

.gate{display:grid;place-items:center;min-height:78vh;padding:24px 0}
.gatebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:30px 28px;max-width:400px;width:100%;text-align:center}
.gatebox h1{font-size:31px;text-transform:uppercase;margin-top:16px}
.gatebox p{color:var(--ink-2);font-size:14px;margin-top:9px}
.gatebox form{display:flex;gap:8px;margin-top:20px}
.gatebox input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;
  padding:9px 16px;font-size:14px}
.gatebox input:focus{outline:none;border-color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

HOSTS.forEach(function(h){HOST_BY_ID[h.id]=h;});

/* Erkennung der Position aus der CSV-Spalte. */
var POS_ALIASES = {
  tw:['torwart','torhueter','torhuter','tw','goalie','keeper','gk','tor','goalkeeper','portiere'],
  av:['aussenverteidiger','ausenverteidiger','av','rv','lv','rechtsverteidiger','linksverteidiger','rb','lb','rwb','lwb',
      'wingback','fullback','aussenbahn','rechtsback','linksback','ra-verteidiger'],
  iv:['innenverteidiger','iv','cb','verteidiger','abwehr','def','zentrale abwehr','libero','ausputzer'],
  zm:['zentrales mittelfeld','zm','cm','sechser','6','sechs','dm','defensives mittelfeld','zdm','achter','8','acht',

  zmo:['zentrales mittelfeld offensiv','zentrales mittelfeld offensive','zmo','zom','offensives mittelfeld','om','am',
      'zehner','10','zehn','spielmacher','haengende spitze','hangende spitze','cam'],
  fl:['fluegelspieler','flugelspieler','fluegel','flugel','fl','winger','rf','lf','ra','la','rechtsaussen','linksaussen',

  st:['stuermer','sturmer','st','cf','mittelstuermer','angreifer','striker','9','neun','neuner','spitze','forward','fw','sturm']
};

  POS_ALIASES[pid].forEach(function(a){ALIAS_LOOKUP[a]=pid;});
});

/* ============================================================
   Utils
   ============================================================ */
function $(sel,root){return (root||document).querySelector(sel);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fold(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function slug(s){return fold(s).replace(/ /g,'-');}
/* ID nur aus dem Namen: wechselt ein Spieler den Klub, bleibt es derselbe
   Spieler. Namensgleiche bekommen den Klub angehängt. */
function playerId(name,team,taken){
  var base=slug(name)||'spieler';
  if(!taken||!taken[base]) return base;
  var withTeam=base+'~'+slug(team);
  if(!taken[withTeam]) return withTeam;
  var i=2; while(taken[withTeam+'-'+i]) i++;
  return withTeam+'-'+i;
}
function seasonGuess(){
  var d=new Date(), y=d.getFullYear();
  if(d.getMonth()<6) y--;               /* vor Juli gehört zur Saison davor */
  return y+'/'+String(y+1).slice(2);
}
function newId(prefix){
  return prefix+'-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36);
}
function fmtDate(iso){
  if(!iso) return '–';
  var d=new Date(iso);
  if(isNaN(d)) return '–';
  var p=function(n){return n<10?'0'+n:''+n;};
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes());
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad2(n){n=parseInt(n,10);return (n<10?'0':'')+n;}
/* Akzeptiert 2003-06-13 und 13.06.2003. */
function parseBirth(v){
  var s=String(v==null?'':v).trim();
  if(!s) return null;
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  m=s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
  if(m) return m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]);
  return null;
}
/* Das Alter wird immer aus dem Geburtsdatum gerechnet, nie eingelesen —
   so veraltet die Zahl nicht mit der Datei. */
function ageOf(o){
  if(!o||!o.birth) return null;
  var b=new Date(o.birth+'T00:00:00');
  if(isNaN(b)) return null;
  var t=new Date(), a=t.getFullYear()-b.getFullYear(), md=t.getMonth()-b.getMonth();
  if(md<0||(md===0&&t.getDate()<b.getDate())) a--;
  return (a>=0&&a<60)?a:null;
}
/* Klublogos: als Data-URI eingebettet, weil der Artifact-CSP keine
   externen Bilder lädt. Erzeugt von fetch-logos.js. */
var TEAM_LOGOS={};
try{ TEAM_LOGOS=JSON.parse(document.getElementById('sst-logos').textContent)||{}; }catch(e){}
var LOGO_CACHE={};
function logoFor(team){
  if(!team) return null;
  var k=fold(team);
  if(LOGO_CACHE[k]!==undefined) return LOGO_CACHE[k];
  var hit=TEAM_LOGOS[k]||null;
  if(!hit){
    /* Zweiter Versuch über Teilstrings — "FC Basel" trifft "FC Basel 1893". */
    var keys=Object.keys(TEAM_LOGOS);
    for(var i=0;i<keys.length&&!hit;i++){
      if(keys[i].indexOf(k)>=0||k.indexOf(keys[i])>=0) hit=TEAM_LOGOS[keys[i]];
    }
  }
  LOGO_CACHE[k]=hit;
  return hit;
}
function teamMark(team,size){
  var cls='tlogo'+(size?' '+size:'');
  var l=logoFor(team);
  if(l) return '<span class="'+cls+(l.tone==='light'?' on-dark':'')+'">'+
    '<img src="'+l.src+'" alt="" loading="lazy"></span>';
  var ini=(team||'?').replace(/[^A-Za-zÀ-ÿ ]/g,'').split(/\s+/).filter(Boolean)
    .map(function(w){return w[0];}).join('').slice(0,3).toUpperCase();
  return '<span class="'+cls+' empty">'+esc(ini||'?')+'</span>';
}
function metaParts(entry){
  var live=inPool(entry.id);
  return {team:(live&&live.team)||entry.team||'', age:ageOf(live||entry)};
}
/* Klub darf gekürzt werden, das Alter nie — es steht in einem eigenen, nicht
   schrumpfenden Element. */
function metaTextOf(entry){
  var m=metaParts(entry);
  return '<span class="mtxt">'+esc(m.team||'—')+'</span>'+
         (m.age?'<span class="mage">· '+m.age+' J.</span>':'');
}
/* Team-Zeile unter dem Namen: Logo, Klub, Alter aus dem Geburtsdatum. */
function metaOf(entry){
  return teamMark(metaParts(entry).team)+metaTextOf(entry);
}
/* Rang-Kachel im Stil der Sendungsgrafik: Platz 1 dunkel, Mittelfeld in zwei
   Goldtönen im Wechsel, der letzte Platz rot. */
function rankBox(ix,total){
  var cls = ix===1 ? 'r-top' : (total>2&&ix===total) ? 'r-last' : (ix%2 ? 'r-b' : 'r-a');
  return '<span class="rankbox '+cls+'">'+ix+'</span>';
}

/* Bestätigungsdialog (window.confirm ist im Artifact-Frame nicht garantiert). */
function confirmBox(opts){
  return new Promise(function(resolve){
    var scrim=document.createElement('div');
    scrim.className='scrim';
    scrim.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+
      '<h3>'+esc(opts.title)+'</h3><p>'+esc(opts.text)+'</p>'+
      '<div class="btns"><button class="btn" data-no>'+esc(opts.cancel||'Abbrechen')+'</button>'+
      '<button class="btn '+(opts.danger?'dgr':'pri')+'" data-yes>'+esc(opts.ok||'OK')+'</button></div></div>';
    function close(v){document.removeEventListener('keydown',onKey);scrim.remove();resolve(v);}
    function onKey(e){if(e.key==='Escape')close(false);}
    scrim.addEventListener('click',function(e){
      if(e.target===scrim) close(false);
      if(e.target.closest('[data-no]')) close(false);
      if(e.target.closest('[data-yes]')) close(true);
    });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(scrim);
    var y=scrim.querySelector('[data-yes]'); if(y) y.focus();
  });
}

/* Kleiner Formular-Dialog — für neue Erhebungen. */
function formBox(opts){
  return new Promise(function(resolve){
    var scrim=document.createElement('div');
    scrim.className='scrim';
    var body=opts.fields.map(function(f,ix){
      if(f.type==='select'){
        return '<label class="fld"><span>'+esc(f.label)+'</span><select data-f="'+f.name+'">'+
          f.options.map(function(o){
            return '<option value="'+esc(o.value)+'"'+(o.value===f.value?' selected':'')+'>'+esc(o.label)+'</option>';
          }).join('')+'</select></label>';
      }
      if(f.type==='check'){
        return '<label class="fld chk"><input type="checkbox" data-f="'+f.name+'"'+(f.value?' checked':'')+'>'+
          '<span>'+esc(f.label)+'</span></label>';
      }
      return '<label class="fld"><span>'+esc(f.label)+'</span>'+
        '<input type="text" data-f="'+f.name+'" value="'+esc(f.value||'')+'"'+
        (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+(ix===0?' autofocus':'')+'></label>';
    }).join('');
    scrim.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+
      '<h3>'+esc(opts.title)+'</h3>'+
      (opts.text?'<p>'+esc(opts.text)+'</p>':'')+
      '<div class="flds">'+body+'</div>'+
      '<div class="btns"><button class="btn" data-no>Abbrechen</button>'+
      '<button class="btn pri" data-yes>'+esc(opts.ok||'OK')+'</button></div></div>';
    function values(){
      var v={};
      scrim.querySelectorAll('[data-f]').forEach(function(el){
        v[el.getAttribute('data-f')] = el.type==='checkbox' ? el.checked : el.value.trim();
      });
      return v;
    }
    function close(val){document.removeEventListener('keydown',onKey);scrim.remove();resolve(val);}
    function onKey(e){
      if(e.key==='Escape') close(null);
      if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();close(values());}
    }
    scrim.addEventListener('click',function(e){
      if(e.target===scrim||e.target.closest('[data-no]')) close(null);
      if(e.target.closest('[data-yes]')) close(values());
    });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(scrim);
    var first=scrim.querySelector('input[type="text"],select');
    if(first) first.focus();
  });
}

   Zustand + Speichern
   ============================================================ */
var HEAD_TITLE='Stammtischtrainer Ranking';
var FONT_HREF='https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap';
var SHELL='<div id="app"></div>\n<div id="toast" role="status" aria-live="polite"><\/div>';

var STATE;
try{ STATE=JSON.parse(document.getElementById('sst-state').textContent); }
catch(e){ STATE=null; }
if(!STATE||typeof STATE!=='object') STATE={};
STATE=migrate(STATE);

/* Hebt einen gespeicherten Zustand auf das aktuelle Schema.
   v1 kannte nur ein einziges Ranking-Set; das wird zur ersten Erhebung. */
function migrate(st){
  if(!st.pool) st.pool={players:[],fileName:null,updatedAt:null,warnings:[]};
  if(!Array.isArray(st.pool.players)) st.pool.players=[];
  if(!Array.isArray(st.pool.imports)) st.pool.imports=[];
  if(!st.rankings||typeof st.rankings!=='object') st.rankings={};

  if(!st.v||st.v<2){
    /* Spieler-IDs von name~team auf name umstellen */
    var taken={}, idMap={};
    st.pool.players.forEach(function(pl){
      var nid=playerId(pl.name,pl.team,taken);
      taken[nid]=1; idMap[pl.id]=nid; pl.id=nid;
      if(!pl.addedAt) pl.addedAt=null;
      pl.gone=false;
      pl.posManual=false;
    });
    var old=st.rankings, hasOld=false;
    Object.keys(old).forEach(function(k){ if(old[k]&&(old[k].adi||old[k].fabio)) hasOld=true; });
    var ed={id:newId('erh'),season:seasonGuess(),phase:'transfer',createdAt:new Date().toISOString()};
    st.editions=[ed];
    st.currentEditionId=ed.id;
    st.rankings={};
    if(hasOld){
      /* Snapshots in den Rankings auf die neuen IDs heben */
      Object.keys(old).forEach(function(posId){
        var byHost=old[posId]; if(!byHost) return;
        HOSTS.forEach(function(h){
          var e=byHost[h.id]; if(!e||!e.tiers) return;
          TIERS.forEach(function(t){
            (e.tiers[t.id]||[]).forEach(function(sn){
              sn.id=idMap[sn.id]||slug(sn.name)||sn.id;
            });
          });
        });
      });
      st.rankings[ed.id]=old;
    }
    st.v=2;
  }

  if(!Array.isArray(st.editions)||!st.editions.length){
    var first={id:newId('erh'),season:seasonGuess(),phase:'transfer',createdAt:new Date().toISOString()};
    st.editions=[first];
    st.currentEditionId=first.id;
  }
  if(!st.editions.some(function(e){return e.id===st.currentEditionId;})){
    st.currentEditionId=sortedEditions(st)[sortedEditions(st).length-1].id;
  }
  return st;
}

/* Chronologisch: Saison aufsteigend, darin Transferfenster -> Hinrunde -> Saisonende. */
function sortedEditions(st){
  return (st||STATE).editions.slice().sort(function(a,b){
    if(a.season!==b.season) return a.season.localeCompare(b.season,'de');
    return (PHASE_BY_ID[a.phase]?PHASE_BY_ID[a.phase].order:9)-(PHASE_BY_ID[b.phase]?PHASE_BY_ID[b.phase].order:9);
  });
}
function editionById(id){
  for(var i=0;i<STATE.editions.length;i++) if(STATE.editions[i].id===id) return STATE.editions[i];
  return null;
}
function editionLabel(ed){
  if(!ed) return '—';
  var ph=PHASE_BY_ID[ed.phase];
  return ed.season+' · '+(ed.label||(ph?ph.short:ed.phase));
}
function currentEdition(){ return editionById(STATE.currentEditionId)||sortedEditions()[0]; }
/* Die Erhebung direkt davor — Basis für alle Veränderungswerte. */
function previousEdition(id){
  var list=sortedEditions(), ix=-1;
  for(var i=0;i<list.length;i++) if(list[i].id===id) ix=i;
  return ix>0?list[ix-1]:null;
}
function rankingsOf(edId){ return (STATE.rankings&&STATE.rankings[edId])||{}; }

var artifactNS=null;      // Capability-Namespace, sobald aufgelöst
var writeState='pending'; // 'pending' | 'ready' | 'readonly'
var saving=false;
var leaving=false;        // nach erfolgreichem publish lädt die Ansicht neu

/* Wo der Zustand liegt. 'artifact' = die Seite speichert sich selbst (claude.ai),
   'api' = gemeinsamer Speicher hinter /api/state (Vercel), 'readonly' = weder
   noch, etwa auf einem rein statischen Host. */
var BACKEND='pending';
var API_BASE=(function(){
  var m=document.querySelector('meta[name="sst-api"]');
  return (m&&m.content||'').replace(/\/$/,'');
})();
var apiVersion=0, apiKey=null, apiNeedsKey=false, apiSetupMsg='', pollTimer=null;
try{ apiKey=localStorage.getItem('sst:key')||null; }catch(e){}

/* Erzeugt die vollständige Seite neu — Quelle sind die eigenen
   <style>- und <script>-Blöcke, nie das gerenderte DOM. */
function buildDoc(state){
  var css=document.getElementById('sst-style').textContent;
  var js=document.getElementById('sst-app').textContent;
  var logos=document.getElementById('sst-logos').textContent;
  var json=JSON.stringify(state)
    .replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var S='<'+'script', E='<'+'/script>';
  return '<!doctype html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<title>'+HEAD_TITLE+'</title>\n'+
    '<link rel="stylesheet" href="'+FONT_HREF+'">\n'+
    '<style id="sst-style">'+css+'</style>\n</head>\n<body>\n'+SHELL+'\n'+
    S+' type="application/json" id="sst-logos">'+logos+E+'\n'+
    S+' type="application/json" id="sst-state">'+json+E+'\n'+
    S+' id="sst-app">'+js+E+'\n</body>\n</html>';
}

function stashUI(){
  try{ sessionStorage.setItem('sst:ui',JSON.stringify(UI)); }catch(e){}
}
function restoreUI(){
  try{
    var raw=sessionStorage.getItem('sst:ui');
    if(raw){ var u=JSON.parse(raw); if(u&&u.view) return u; }
  }catch(e){}
  return null;
}

/* Schreibt den neuen Zustand. Nach erfolgreichem publish lädt die
   Ansicht neu — deshalb ist das Speichern immer die letzte Aktion. */
function commit(next,successMsg){
  if(saving) return Promise.resolve(false);
  if(BACKEND==='readonly'||writeState==='readonly'){
    toast('Diese Ansicht ist schreibgeschützt — nichts gespeichert.',true);
    return Promise.resolve(false);
  }
  saving=true; render();
  stashUI();
  var work = BACKEND==='api' ? apiSave(next) : artifactSave(next);
  return work.then(function(){
    STATE=next;
    if(BACKEND==='artifact') leaving=true;   /* der Shell lädt die Ansicht neu */
    POOLEDIT=null; poolDraftDrop();          /* Arbeitskopie ist eingeflossen */
    toast(successMsg||'Gespeichert');
    saving=false; render();
    return true;
  }).catch(function(err){
    saving=false;
    handleSaveError((err&&err.code)||'upstream_error');
    render();
    return false;
  });
}

function artifactSave(next){
  var p = artifactNS ? Promise.resolve(artifactNS) : claudeUse();
  return p.then(function(ns){
    if(!ns){ writeState='readonly'; throw {code:'not_granted'}; }
    artifactNS=ns; writeState='ready';
    return ns.publish(buildDoc(next));
  });
}

function handleSaveError(code){
  if(code==='conflict'){
    if(BACKEND==='api'){
      toast('Der andere Host hat zuerst gespeichert. Der neue Stand wird geladen — dein Entwurf bleibt erhalten.',true);
      apiReload();
    }else{
      toast('Jemand anderes hat gerade gespeichert. Die Seite lädt neu — dein Entwurf bleibt erhalten.',true);
    }
  }else if(code==='auth'){
    apiNeedsKey=true;
    toast('Passwort abgelehnt. Bitte neu eingeben.',true);
  }else if(code==='setup'){
    toast(apiSetupMsg||'Der Speicher ist auf dem Server noch nicht eingerichtet.',true);
  }else if(code==='not_granted'||code==='not_writer'||code==='consent_required'||code==='capability_disabled'||code==='not_declared'){
    writeState='readonly'; BACKEND='readonly';
    toast('Diese Ansicht darf nicht speichern. Änderungen bleiben nur im Browser.',true);
  }else if(code==='too_large'){
    toast('Zu viele Daten für einen Stand. Spielerliste kürzen.',true);
  }else if(code==='rate_limited'){
    toast('Zu schnell gespeichert. Kurz warten und nochmals versuchen.',true);
  }else{
    toast('Speichern fehlgeschlagen. Nochmals versuchen.',true);
  }
}

function claudeUse(){
  if(!window.claude||typeof window.claude.use!=='function') return Promise.resolve(null);
  return window.claude.use('artifact').catch(function(){return null;});
}

/* ---------- gemeinsamer Speicher hinter /api/state ---------- */
function apiFetch(opts){
  var h={'content-type':'application/json'};
  if(apiKey) h['x-sst-key']=apiKey;
  var cfg={headers:h,cache:'no-store'};
  if(opts) for(var k in opts) cfg[k]=opts[k];
  return fetch(API_BASE+'/api/state',cfg).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=JSON.parse(t); }catch(e){}
      return {status:r.status,ok:r.ok,json:j};
    });
  });
}
function codeForStatus(r){
  if(r.status===409) return 'conflict';
  if(r.status===401) return 'auth';
  if(r.status===503) return 'setup';
  if(r.status===413) return 'too_large';
  return 'upstream_error';
}
function apiSave(next){
  return apiFetch({method:'PUT',body:JSON.stringify({baseVersion:apiVersion,state:next})})
    .then(function(r){
      if(r.ok&&r.json){ apiVersion=Number(r.json.version||0); return true; }
      if(r.json&&r.json.message) apiSetupMsg=r.json.message;
      throw {code:codeForStatus(r)};
    });
}
function adoptRemote(j){
  apiVersion=Number(j.version||0);
  if(j.state&&typeof j.state==='object'){
    STATE=migrate(j.state);
    if(UI.view==='position'&&!POS_BY_ID[UI.pos]) UI.view='overview';
  }
}
function apiReload(){
  return apiFetch().then(function(r){
    if(r.ok&&r.json){ adoptRemote(r.json); render(); }
  }).catch(function(){});
}
/* Der andere Host speichert in seinem Browser — ohne Nachfragen bekämen wir
   davon nichts mit. Nur nachladen, wenn hier gerade nichts offen ist. */
function startPolling(){
  if(pollTimer) return;
  pollTimer=setInterval(function(){
    if(BACKEND!=='api'||saving||apiNeedsKey) return;
    if(EDIT&&EDIT.dirty) return;
    if(poolDirty()) return;
    if(document.querySelector('.scrim')) return;
    apiFetch().then(function(r){
      if(!r.ok||!r.json) return;
      if(Number(r.json.version||0)<=apiVersion) return;
      adoptRemote(r.json); render();
      toast('Neuer Stand vom anderen Host geladen');
    }).catch(function(){});
  },15000);
}
function saveApiKey(v){
  apiKey=v||null;
  try{ if(apiKey) localStorage.setItem('sst:key',apiKey); else localStorage.removeItem('sst:key'); }catch(e){}
}
function detectBackend(){
  return claudeUse().then(function(ns){
    if(ns){ artifactNS=ns; BACKEND='artifact'; writeState='ready'; render(); return; }
    return apiFetch().then(function(r){
      if(!r.json){ BACKEND='readonly'; render(); return; }   /* statischer Host */
      if(r.status===401){ BACKEND='api'; apiNeedsKey=true; render(); return; }
      if(r.status===503){
        BACKEND='api'; apiSetupMsg=(r.json&&r.json.message)||''; render(); return;
      }
      if(r.ok){
        BACKEND='api'; apiNeedsKey=false;
        adoptRemote(r.json); startPolling(); render(); return;
      }
      BACKEND='readonly'; render();
    });
  }).catch(function(){ BACKEND='readonly'; render(); });
}

/* ============================================================
   CSV
   ============================================================ */
function detectDelimiter(line){
  var best=',',n=-1;
  [';',',','\t','|'].forEach(function(d){
    var c=line.split(d).length-1;
    if(c>n){n=c;best=d;}
  });
  return n>0?best:',';
}

function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  var firstLine=text.split(/\r\n|\n|\r/)[0]||'';
  var d=detectDelimiter(firstLine);
  var rows=[],row=[],field='',inQ=false,i=0;
  while(i<text.length){
    var c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i+=2;continue;}
        inQ=false;i++;continue;
      }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===d){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  row.push(field);rows.push(row);
  return rows.filter(function(r){return r.some(function(v){return String(v).trim()!=='';});});
}

var HEAD_NAME=['name','spieler','player','spielername','nachname'];
var HEAD_POS=['position','pos','positionen','rolle','spielposition'];
var HEAD_TEAM=['team','verein','club','klub','mannschaft'];
var HEAD_BIRTH=['geburtsdatum','geburtstag','geboren','birthdate','date of birth','dob','birthday'];

function parseRoster(text){
  var rows=parseCSV(text);
  if(!rows.length) return {error:'Die Datei enthält keine Zeilen.'};
  var head=rows[0].map(function(h){return fold(h);});
  var iN=-1,iP=-1,iT=-1,iB=-1;
  head.forEach(function(h,ix){
    if(iN<0&&HEAD_NAME.indexOf(h)>=0) iN=ix;
    if(iP<0&&HEAD_POS.indexOf(h)>=0) iP=ix;
    if(iT<0&&HEAD_TEAM.indexOf(h)>=0) iT=ix;
    if(iB<0&&HEAD_BIRTH.indexOf(h)>=0) iB=ix;
  });
  var body;
  if(iN>=0&&iP>=0){ body=rows.slice(1); }
  else { iN=0;iP=1;iT=2;iB=3; body=rows; }

  var list=[],seen={},unknown={};
  body.forEach(function(r){
    var name=(r[iN]||'').trim();
    if(!name) return;
    var rawPos=(iP>=0?(r[iP]||''):'').trim();
    var team=(iT>=0?(r[iT]||''):'').trim();
    var parts=rawPos.split(/[\/,;|]+| und | & /i).map(function(x){return fold(x);}).filter(Boolean);
    var pos=[];
    parts.forEach(function(x){
      var hit=ALIAS_LOOKUP[x];
      if(hit){ if(pos.indexOf(hit)<0) pos.push(hit); }
      else if(x){ unknown[x]=(unknown[x]||0)+1; }
    });
    var key=slug(name)+'~'+slug(team);
    if(seen[key]){
      pos.forEach(function(x){ if(seen[key].pos.indexOf(x)<0) seen[key].pos.push(x); });
      return;
    }
    var row={name:name,team:team,pos:pos,raw:rawPos,
             birth:iB>=0?parseBirth(r[iB]):null};
    seen[key]=row; list.push(row);
  });

  if(!list.length) return {error:'Keine Spieler gefunden. Erwartet werden Spalten für Name, Position und Team.'};
  return {rows:list, unknownPositions:Object.keys(unknown)};
}

/* Führt eine neue Datei mit dem bestehenden Pool zusammen, statt ihn zu ersetzen:
   bekannte Spieler werden aktualisiert, neue kommen dazu, fehlende werden als
   "nicht mehr im Kader" markiert. Von Hand gesetzte Positionen bleiben unangetastet. */
function mergeRoster(parsed,fileName){
  var now=new Date().toISOString();
  var prev=(STATE.pool.players||[]).map(clone);
  var byId={}, byNameTeam={}, byName={}, taken={};
  prev.forEach(function(pl){
    byId[pl.id]=pl; taken[pl.id]=1;
    byNameTeam[slug(pl.name)+'~'+slug(pl.team)]=pl;
    var k=slug(pl.name); (byName[k]=byName[k]||[]).push(pl);
  });

  var out=prev.slice(), outById=byId, seenNow={}, added=[], moved=[], kept=0;

  parsed.rows.forEach(function(row){
    var hit=byNameTeam[slug(row.name)+'~'+slug(row.team)];
    if(!hit){
      var cands=byName[slug(row.name)]||[];
      if(cands.length===1) hit=cands[0];   /* gleicher Name, anderer Klub -> Transfer */
    }
    if(hit){
      var t=outById[hit.id];
      if(row.team && t.team!==row.team){ moved.push({name:t.name,from:t.team,to:row.team}); t.team=row.team; }
      if(row.birth) t.birth=row.birth;
      t.raw=row.raw;
      t.gone=false;
      if(!t.posManual && row.pos.length) t.pos=row.pos;
      seenNow[t.id]=1; kept++;
    }else{
      var id=playerId(row.name,row.team,taken); taken[id]=1;
      var np={id:id,name:row.name,team:row.team,pos:row.pos.slice(),raw:row.raw,
              birth:row.birth,gone:false,posManual:false,addedAt:now};
      out.push(np); outById[id]=np; seenNow[id]=1; added.push(np);
    }
  });

  var gone=[];
  out.forEach(function(pl){
    if(!seenNow[pl.id]){ if(!pl.gone) gone.push(pl); pl.gone=true; }
  });

  var imports=(STATE.pool.imports||[]).slice(0,19);
  imports.unshift({at:now,fileName:fileName||null,added:added.length,gone:gone.length,total:out.length});

  return {
    pool:{
      players:out,
      fileName:fileName||null,
      updatedAt:now,
      lastImportAt:now,
      warnings:[],
      unknownPositions:parsed.unknownPositions||[],
      imports:imports
    },
    report:{added:added.length,kept:kept,gone:gone.length,total:out.length,
            moved:moved,firstImport:prev.length===0,at:now}
  };
}

function isNewSince(pl){
  return !!(pl.addedAt && STATE.pool.lastImportAt && pl.addedAt===STATE.pool.lastImportAt);
}

function readFileSmart(file){
  return new Promise(function(resolve,reject){
    var fr=new FileReader();
    fr.onerror=function(){reject(new Error('Datei konnte nicht gelesen werden.'));};
    fr.onload=function(){
      var buf=fr.result;
      var txt;
      try{ txt=new TextDecoder('utf-8',{fatal:false}).decode(buf); }
      catch(e){ txt=''; }
      if(/\ufffd/.test(txt)){
        try{ txt=new TextDecoder('windows-1252').decode(buf); }catch(e){}
      }
      resolve(txt);
    };
    fr.readAsArrayBuffer(file);
  });
}

/* ============================================================
   Ranking-Helfer + Konsens
   ============================================================ */
function emptyTiers(){return {a:[],k:[],p:[]};}
function getEntryIn(edId,posId,host){
  var r=rankingsOf(edId)[posId];
  return (r&&r[host])||null;
}
function getEntry(posId,host){ return getEntryIn(STATE.currentEditionId,posId,host); }
function countEntry(e){
  if(!e) return 0;
  return TIERS.reduce(function(n,t){return n+((e.tiers&&e.tiers[t.id]||[]).length);},0);
}
function poolFor(posId){
  return poolPlayers().filter(function(p){return !p.gone&&p.pos.indexOf(posId)>=0;});
}
function bothDone(posId,edId){
  edId=edId||STATE.currentEditionId;
  return !!getEntryIn(edId,posId,'adi')&&!!getEntryIn(edId,posId,'fabio');
}
function inPool(id){
  var arr=poolPlayers();
  for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i];
  return null;
}

/* Punkte: Tier zählt schwer, Platz innerhalb des Tiers fein.
   Auslands ready #1 = 360, Super-League King #1 = 260, Potenzialspieler #1 = 160. */
function placement(entry,pid){
  if(!entry) return null;
  for(var i=0;i<TIERS.length;i++){
    var t=TIERS[i], list=(entry.tiers&&entry.tiers[t.id])||[];
    for(var j=0;j<list.length;j++){
      if(list[j].id===pid) return {tier:t.id,val:t.val,rank:j+1,pts:t.val*100+Math.max(0,60-j)};
    }
  }
  return null;
}

function consensus(posId,edId){
  edId=edId||STATE.currentEditionId;
  var entries={};
  HOSTS.forEach(function(h){entries[h.id]=getEntryIn(edId,posId,h.id);});
  var byId={};
  HOSTS.forEach(function(h){
    var e=entries[h.id]; if(!e) return;
    TIERS.forEach(function(t){
      ((e.tiers&&e.tiers[t.id])||[]).forEach(function(p,ix){
        var rec=byId[p.id]||(byId[p.id]={id:p.id,name:p.name,team:p.team,birth:p.birth||null,pts:0,by:{}});
        rec.name=rec.name||p.name; rec.team=rec.team||p.team;
        rec.birth=rec.birth||p.birth||null;
        rec.by[h.id]={tier:t.id,rank:ix+1};
        rec.pts+=t.val*100+Math.max(0,60-ix);
      });
    });
  });
  var groups={a:[],k:[],p:[]};
  Object.keys(byId).forEach(function(id){
    var rec=byId[id];
    var vals=[],n=0;
    HOSTS.forEach(function(h){
      var b=rec.by[h.id];
      if(b){vals.push(TIER_BY_ID[b.tier].val);n++;}
    });
    var avg=vals.reduce(function(a,b){return a+b;},0)/(n||1);
    var v=Math.floor(avg+0.5); if(v>3)v=3; if(v<1)v=1;
    rec.tier=(v===3?'a':v===2?'k':'p');
    rec.solo=(n===1);
    groups[rec.tier].push(rec);
  });
  TIERS.forEach(function(t){
    groups[t.id].sort(function(x,y){
      if(y.pts!==x.pts) return y.pts-x.pts;
      return x.name.localeCompare(y.name,'de');
    });
  });
  return groups;
}

/* Alle Tiers hintereinander -> ein Gesamtrang je Spieler.
   Nur so ist ein Tier-Wechsel als Veränderung sichtbar. */
function flatRanks(list){
  var m={};
  list.forEach(function(rec,ix){ m[rec.id]=ix+1; });
  return m;
}
function flatListOfEntry(entry){
  var out=[];
  if(!entry) return out;
  TIERS.forEach(function(t){ (entry.tiers&&entry.tiers[t.id]||[]).forEach(function(p){ out.push(p); }); });
  return out;
}
function flatListOfConsensus(groups){
  var out=[];
  TIERS.forEach(function(t){ (groups[t.id]||[]).forEach(function(r){ out.push(r); }); });
  return out;
}
/* Vergleichsliste derselben Sicht in der vorherigen Erhebung. */
function previousFlat(posId,view,edId){
  var prev=previousEdition(edId||STATE.currentEditionId);
  if(!prev) return null;
  if(view==='konsens'){
    if(!bothDone(posId,prev.id)) return null;
    return flatRanks(flatListOfConsensus(consensus(posId,prev.id)));
  }
  var e=getEntryIn(prev.id,posId,view);
  if(!e) return null;
  return flatRanks(flatListOfEntry(e));
}
/* -> {dir:'up'|'down'|'same'|'new', by:n} oder null, wenn es nichts zu vergleichen gibt */
function deltaFor(prevRanks,id,curRank){
  if(!prevRanks) return null;
  var was=prevRanks[id];
  if(!was) return {dir:'new',by:0};
  if(was===curRank) return {dir:'same',by:0};
  return was>curRank?{dir:'up',by:was-curRank}:{dir:'down',by:curRank-was};
}
function deltaChip(d){
  if(!d) return '';
  if(d.dir==='new') return '<span class="dlt neu">NEU</span>';
  if(d.dir==='same') return '<span class="dlt same" title="unverändert">–</span>';
  var up=d.dir==='up';
  return '<span class="dlt '+(up?'up':'down')+'" title="'+(up?'+':'-')+d.by+' Plätze">'+
    (up?'▲':'▼')+d.by+'</span>';
}
/* Wer war vorher dabei und ist jetzt raus? */
function droppedSince(posId,view,edId){
  var prev=previousEdition(edId||STATE.currentEditionId);
  if(!prev) return [];
  var prevList;
  if(view==='konsens'){
    if(!bothDone(posId,prev.id)) return [];
    prevList=flatListOfConsensus(consensus(posId,prev.id));
  }else{
    var e=getEntryIn(prev.id,posId,view);
    if(!e) return [];
    prevList=flatListOfEntry(e);
  }
  var now={};
  var curList = view==='konsens'
    ? (bothDone(posId,edId) ? flatListOfConsensus(consensus(posId,edId)) : [])
    : flatListOfEntry(getEntryIn(edId||STATE.currentEditionId,posId,view));
  curList.forEach(function(p){ now[p.id]=1; });
  return prevList.filter(function(p){ return !now[p.id]; });
}

   damit eine frische Zuordnung sofort überall greift. */
function poolPlayers(){ return POOLEDIT?POOLEDIT.players:(STATE.pool.players||[]); }
function ensurePoolEdit(){
  if(!POOLEDIT) POOLEDIT={players:clone(STATE.pool.players||[]),dirty:false};
  return POOLEDIT;
}
function poolDirty(){ return !!(POOLEDIT&&POOLEDIT.dirty); }

function baseNext(){

}

function poolDraftLoad(){
  try{
    var raw=localStorage.getItem('sst:pooldraft');
    if(!raw) return;
    var arr=JSON.parse(raw);
    if(Array.isArray(arr)&&arr.length){
      var same=arr.length===(STATE.pool.players||[]).length &&
        JSON.stringify(arr)===JSON.stringify(STATE.pool.players);
      if(!same) POOLEDIT={players:arr,dirty:true};

    }
  }catch(e){}
}

/* Weist einer Auswahl eine Position zu. mode 'set' ersetzt, 'add' ergänzt,
   posId null räumt alle Positionen weg. */
function assignPositions(ids,posId,mode){
  var pe=ensurePoolEdit(), byId={};
  pe.players.forEach(function(pl){byId[pl.id]=pl;});
  var n=0;
  ids.forEach(function(id){
    var pl=byId[id]; if(!pl) return;
    if(posId===null){ pl.pos=[]; }
    else if(mode==='add'){ if(pl.pos.indexOf(posId)<0) pl.pos.push(posId); }
    else { pl.pos=[posId]; }
    pl.posManual=true;
    n++;
  });
  pe.dirty=true; poolDraftSave();
  return n;
}
function removePosition(id,posId){
  var pe=ensurePoolEdit();
  pe.players.forEach(function(pl){
    if(pl.id!==id) return;
    pl.pos=pl.pos.filter(function(x){return x!==posId;});
    pl.posManual=true;
  });
  pe.dirty=true; poolDraftSave();
}

}
function loadDraft(pos,host){
  try{
    var raw=localStorage.getItem(draftKey(pos,host));
    if(!raw) return null;
    var t=JSON.parse(raw);
    if(t&&t.a&&t.k&&t.p) return t;
  }catch(e){}
  return null;
}
function dropDraft(pos,host){
  try{ localStorage.removeItem(draftKey(pos,host)); }catch(e){}

function tiersEqual(x,y){
  return TIERS.every(function(t){
    var A=(x&&x[t.id])||[], B=(y&&y[t.id])||[];
    if(A.length!==B.length) return false;
    for(var i=0;i<A.length;i++) if(A[i].id!==B[i].id) return false;
    return true;
  });
}

function openEditor(pos,host){
  var e=getEntry(pos,host);
  var base=e?clone(e.tiers):emptyTiers();
  TIERS.forEach(function(t){ if(!base[t.id]) base[t.id]=[]; });
  var d=loadDraft(pos,host);
  var dirty=false;
  if(d&&!tiersEqual(d,base)){ base=d; dirty=true; }
  EDIT={pos:pos,host:host,tiers:base,dirty:dirty};
  AC={open:false,items:[],sel:0,tier:null,q:''};
}

    if(!it.ok) cls+=' no';

/* ---------- Konsens ---------- */
function renderConsensus(posId){
  if(!bothDone(posId)){
    var missing=HOSTS.filter(function(h){return !getEntry(posId,h.id);}).map(function(h){return h.name;});
    return '<div class="locked"><h3>Konsens noch gesperrt</h3>'+
      '<p>Es fehlt das Ranking von <b>'+esc(missing.join(' und '))+'</b>. '+
      'Sobald beide abgegeben haben, erscheint hier die zusammengezählte Rangliste.</p></div>';
  }
  var g=consensus(posId);
  var prevRanks=previousFlat(posId,'konsens'), flatIx=0;
  var total=TIERS.reduce(function(n,t){return n+g[t.id].length;},0);
  var h='<div class="board cols">';
  TIERS.forEach(function(t){
    var list=g[t.id];
    var inner=list.length?'<ul>'+list.map(function(rec,ix){
      flatIx++;
      var dl=deltaFor(prevRanks,rec.id,flatIx);
      var votes=HOSTS.map(function(hh){
        var b=rec.by[hh.id];
        if(!b) return '<span class="vote miss">'+hh.name[0]+' –</span>';
        return '<span class="vote '+b.tier+'">'+hh.name[0]+' '+TIER_BY_ID[b.tier].abbr+' #'+b.rank+'</span>';
      }).join('');
      return '<li class="crow boxed">'+
        rankBox(flatIx,total)+
        teamMark(metaParts(rec).team,'lg')+
        '<span class="nm"><b>'+esc(rec.name)+'</b><span>'+metaTextOf(rec)+'</span></span>'+
        '<span class="votes">'+votes+'</span>'+
        deltaChip(dl)+'</li>';
    }).join('')+'</ul>':'<div class="empty">Kein Spieler in diesem Tier.</div>';
    h+=tierPanel(t.id,inner,list.length+'');
  });
  h+='</div>';
  h+=droppedBlock(posId,'konsens');
  h+='<div class="banner"><span>ⓘ</span><span>'+
    '<b>So entsteht die Reihenfolge:</b> Das Tier zählt schwer, der Platz darin fein. '+
    'Beide Wertungen werden zusammengezählt, das Tier im Konsens ist der Durchschnitt der '+
    'beiden Einstufungen. Nennt nur einer einen Spieler, zählt er auch nur einmal — '+
    'Übereinstimmung wiegt dadurch schwerer als eine einzelne Spitzennennung.'+
    '</span></div>';
  h+='<div class="actions"><span class="hint">Konsens aus beiden Rankings</span><span class="sp"></span>'+
    '<button class="btn" data-act="copy" data-p="'+posId+'">Als Text kopieren</button></div>';
  return h;
}

   ============================================================ */
function usedMap(){
  var m={};
  if(!EDIT) return m;
  TIERS.forEach(function(t){ EDIT.tiers[t.id].forEach(function(p){ m[p.id]=t.id; }); });
  return m;
}
function searchPlayers(posId,q){
  var qf=fold(q);
  if(!qf) return [];
  var used=usedMap(), out=[];
  STATE.pool.players.forEach(function(p){
    var nameF=fold(p.name), hay=nameF+' '+fold(p.team);
    var at=hay.indexOf(qf);
    if(at<0) return;
    var ok=true,why='';
    if(used[p.id]){ ok=false; why='schon in '+TIER_BY_ID[used[p.id]].abbr; }
    else if(p.pos.indexOf(posId)<0){
      ok=false;
      why=p.pos.length?'spielt '+p.pos.map(function(id){return POS_BY_ID[id].abbr;}).join('/'):'Position unklar';
    }
    out.push({p:p,ok:ok,why:why,rank:(nameF.indexOf(qf)===0?0:nameF.indexOf(qf)>=0?1:2)});
  });
  out.sort(function(x,y){
    if(x.ok!==y.ok) return x.ok?-1:1;
    if(x.rank!==y.rank) return x.rank-y.rank;
    return x.p.name.localeCompare(y.p.name,'de');
  });
  return out.slice(0,14);
}
function closeAllAC(){
  Array.prototype.forEach.call(document.querySelectorAll('#app .adder .ac'),function(el){el.remove();});
}
function firstOk(items){
  for(var i=0;i<items.length;i++) if(items[i].ok) return i;
  return 0;
}
function refreshAC(input){
  var tier=input.getAttribute('data-tier');
  AC.tier=tier; AC.q=input.value;
  AC.items=EDIT?searchPlayers(EDIT.pos,AC.q):[];
  AC.open=!!AC.q;
  AC.sel=firstOk(AC.items);
  /* Es darf immer nur eine Vorschlagsliste offen sein — sonst bleibt die
     Liste des vorherigen Tiers stehen. */
  closeAllAC();
  var adder=input.closest('.adder');
  if(AC.open) adder.insertAdjacentHTML('beforeend',acList(tier));
}
function moveSel(dir){
  if(!AC.open||!AC.items.length) return;
  var i=AC.sel,n=AC.items.length,guard=0;
  do{ i=(i+dir+n)%n; guard++; }while(!AC.items[i].ok&&guard<=n);
  AC.sel=i;
  var ac=$('#app .adder .ac');
  if(!ac) return;
  Array.prototype.forEach.call(ac.children,function(li,ix){
    li.classList.toggle('sel',ix===AC.sel);
    li.setAttribute('aria-selected',ix===AC.sel);
  });
  var el=ac.children[AC.sel];
  if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
}
function pickIndex(ix){
  var it=AC.items[ix];
  if(!it||!it.ok){ if(it) toast(it.why.charAt(0).toUpperCase()+it.why.slice(1)+' — nicht auswählbar.',true); return; }
  EDIT.tiers[AC.tier].push({id:it.p.id,name:it.p.name,team:it.p.team,birth:it.p.birth||null});
  markDirty();
  pendingFocus=AC.tier;
  AC={open:false,items:[],sel:0,tier:AC.tier,q:''};
  render();
}
