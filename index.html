   ============================================================ */
var pendingFocus=null;      /* Tier-ID des Suchfelds, das Fokus behält */
var pendingPoolFocus=false;

function render(){
  var app=$('#app');
  /* Neuzeichnen ersetzt das ganze DOM — ohne das hier springt die Spielerliste
     bei jeder Auswahl zurück an den Anfang. */
  var listTop=null, prev=app.querySelector('.pool-list');
  if(prev) listTop=prev.scrollTop;
  var winY=window.pageYOffset;
  if(BACKEND==='api'&&apiNeedsKey){
    app.innerHTML=renderKeyGate();
    var f=app.querySelector('[data-act="key-input"]');
    if(f) f.focus();
    return;
  }
  var body = UI.view==='pool' ? renderPool()
           : UI.view==='editions' ? renderEditions()
           : UI.view==='position' ? renderPosition()
           : renderOverview();
  app.innerHTML=renderTop()+renderWriteBanner()+body;
  if(pendingFocus){
    var inp=app.querySelector('.adder input[data-tier="'+pendingFocus+'"]');
    if(inp) inp.focus();
    pendingFocus=null;
  }
  if(pendingPoolFocus){
    var pq=app.querySelector('[data-act="poolq"]');
    if(pq){ pq.focus(); var v=pq.value; pq.value=''; pq.value=v; }
    pendingPoolFocus=false;
  }
  var now=app.querySelector('.pool-list');
  if(now&&listTop!=null) now.scrollTop=listTop;
  if(winY&&window.pageYOffset!==winY) window.scrollTo(0,winY);
}

function go(view,pos){
  UI.view=view;
  if(pos) UI.pos=pos;
  stashUI(); render();
  window.scrollTo(0,0);
}

function doSave(){
  if(!EDIT) return;
  var pos=EDIT.pos, host=EDIT.host;
  var ed=STATE.currentEditionId;
  var next=baseNext();
  if(!next.rankings[ed]) next.rankings[ed]={};
  if(!next.rankings[ed][pos]) next.rankings[ed][pos]={};
  next.rankings[ed][pos][host]={updatedAt:new Date().toISOString(),tiers:clone(EDIT.tiers)};
  commit(next,'Ranking von '+HOST_BY_ID[host].name+' gespeichert').then(function(ok){
    if(ok){ dropDraft(pos,host); closeEditor(); UI.tab=host; render(); }
  });
}

function doDelete(pos,host){
  var name=HOST_BY_ID[host].name;
  confirmBox({
    title:'Ranking löschen',
    text:'Das Ranking von '+name+' für '+POS_BY_ID[pos].name+' im Ranking „'+editionLabel(currentEdition())+
         '" wird entfernt. Das Konsens-Ranking dieser Position ist danach wieder gesperrt.',
    ok:'Löschen',danger:true
  }).then(function(yes){
    if(!yes) return;
    var ed=STATE.currentEditionId;
    var next=baseNext();
    var r=next.rankings[ed];
    if(r&&r[pos]){
      delete r[pos][host];
      if(!r[pos].adi&&!r[pos].fabio) delete r[pos];
    }
    commit(next,'Ranking von '+name+' gelöscht').then(function(ok){
      if(ok){ dropDraft(pos,host); if(EDIT&&EDIT.pos===pos&&EDIT.host===host) closeEditor(); render(); }
    });
  });
}

function consensusText(posId){
  var g=consensus(posId), p=POS_BY_ID[posId];
  var out=['Stammtischtrainer — '+p.name,''];
  TIERS.forEach(function(t){
    out.push(t.name.toUpperCase());
    var list=g[t.id];
    if(!list.length) out.push('  —');
    list.forEach(function(rec,ix){
      var v=HOSTS.map(function(h){
        var b=rec.by[h.id];
        return h.name+': '+(b?TIER_BY_ID[b.tier].abbr+' #'+b.rank:'–');
      }).join(', ');
      var live=inPool(rec.id), a=ageOf(live||rec);
      var meta=[rec.team,a?a+'J':''].filter(Boolean).join(', ');
      out.push('  '+(ix+1)+'. '+rec.name+(meta?' ('+meta+')':'')+'  ['+v+']');
    });
    out.push('');
  });
  return out.join('\n');
}
function copyText(txt,msg){
  var done=function(){toast(msg||'Kopiert');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fallback();});
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Kopieren nicht möglich.',true);}
    ta.remove();
  }
}

function applyCSV(file){
  if(!file) return;
  readFileSmart(file).then(function(txt){
    var parsed=parseRoster(txt);
    if(parsed.error){ toast(parsed.error,true); return; }
    var merged=mergeRoster(parsed,file.name);
    var rep=merged.report;
    var text;
    if(rep.firstImport){
      text=rep.added+' Spieler werden geladen.';
    }else{
      var bits=[];
      bits.push(rep.added+' neu');
      bits.push(rep.kept+' weiterhin im Kader');
      if(rep.gone) bits.push(rep.gone+' nicht mehr in der Liste');
      if(rep.moved.length) bits.push(rep.moved.length+' mit neuem Klub');
      text=bits.join(', ')+'. Bestehende Spieler bleiben mit ihren Positionen erhalten, '+
           'fehlende werden nur markiert und nicht gelöscht.';
    }
    confirmBox({
      title: rep.firstImport?'Spielerliste laden':'Liste abgleichen',
      text: text,
      ok: rep.firstImport?'Laden':'Abgleichen'
    }).then(function(yes){
      if(!yes) return;
      var next=clone(STATE);
      next.pool=merged.pool;
      commit(next, rep.firstImport
        ? rep.added+' Spieler geladen'
        : rep.added+' neu, '+rep.gone+' nicht mehr dabei'
      ).then(function(ok){
        if(!ok) return;
        UI.poolQ=''; UI.poolPos='all';
        UI.poolScope = rep.added ? 'neu' : (rep.gone ? 'weg' : 'alle');
        UI.sel={};
        stashUI(); render();
        var unknown=merged.pool.unknownPositions;
        if(unknown && unknown.length){
          setTimeout(function(){
            toast('Position nicht erkannt: '+unknown.slice(0,4).join(', ')+(unknown.length>4?' …':''),true);
          },2200);
        }
      });
    });
  }).catch(function(e){ toast((e&&e.message)||'Datei konnte nicht gelesen werden.',true); });
}

/* ---------- Erhebungen ---------- */
function newEdition(){
  var last=sortedEditions()[STATE.editions.length-1];
  var nextPhase='transfer';
  if(last){
    var ord=PHASE_BY_ID[last.phase]?PHASE_BY_ID[last.phase].order:2;
    nextPhase=PHASES[Math.min(ord+1,PHASES.length-1)].id;
  }
  formBox({
    title:'Neues Ranking',
    text:'Ein neuer Stand. Die Veränderung wird zum direkt vorangehenden Ranking gerechnet.',
    ok:'Anlegen',
    fields:[
      {name:'season',label:'Saison',type:'text',value:(last?last.season:seasonGuess()),placeholder:'2025/26'},
      {name:'phase',label:'Zeitpunkt',type:'select',value:nextPhase,
       options:PHASES.map(function(x){return {value:x.id,label:x.name};})},
      {name:'label',label:'Eigene Bezeichnung (optional)',type:'text',value:''},
      {name:'copy',label:'Eingaben des vorherigen Rankings als Startpunkt übernehmen',type:'check',value:false}
    ]
  }).then(function(v){
    if(!v) return;
    if(!v.season){ toast('Bitte eine Saison angeben.',true); return; }
    var next=baseNext();
    var ed={id:newId('erh'),season:v.season,phase:v.phase,label:v.label||'',createdAt:new Date().toISOString()};
    next.editions.push(ed);
    next.rankings[ed.id]={};
    if(v.copy){
      /* Vorgänger in der neuen Reihenfolge bestimmen */
      var tmp={editions:next.editions};
      var listed=sortedEditions(tmp), ix=-1;
      for(var i=0;i<listed.length;i++) if(listed[i].id===ed.id) ix=i;
      var prev=ix>0?listed[ix-1]:null;
      if(prev&&next.rankings[prev.id]) next.rankings[ed.id]=clone(next.rankings[prev.id]);
    }
    next.currentEditionId=ed.id;
    commit(next,'Ranking „'+editionLabel(ed)+'" angelegt').then(function(ok){
      if(ok){ UI.view='editions'; stashUI(); render(); }
    });
  });
}

function renameEdition(edId){
  var ed=editionById(edId); if(!ed) return;
  formBox({
    title:'Ranking umbenennen',ok:'Speichern',
    fields:[
      {name:'season',label:'Saison',type:'text',value:ed.season},
      {name:'phase',label:'Zeitpunkt',type:'select',value:ed.phase,
       options:PHASES.map(function(x){return {value:x.id,label:x.name};})},
      {name:'label',label:'Eigene Bezeichnung (optional)',type:'text',value:ed.label||''}
    ]
  }).then(function(v){
    if(!v) return;
    if(!v.season){ toast('Bitte eine Saison angeben.',true); return; }
    var next=baseNext();
    next.editions.forEach(function(x){
      if(x.id!==edId) return;
      x.season=v.season; x.phase=v.phase; x.label=v.label||'';
    });
    commit(next,'Ranking umbenannt');
  });
}

function deleteEdition(edId){
  var ed=editionById(edId); if(!ed) return;
  if(STATE.editions.length<2){ toast('Das letzte Ranking lässt sich nicht löschen.',true); return; }
  var st=editionStats(edId);
  confirmBox({
    title:'Ranking löschen',
    text:'„'+editionLabel(ed)+'" wird mit allen Eingaben entfernt ('+st.done+' vollständige Positionen). '+
         'Andere Rankings bleiben; deren Veränderungswerte beziehen sich danach auf das dann vorangehende Ranking.',
    ok:'Löschen',danger:true
  }).then(function(yes){
    if(!yes) return;
    var next=baseNext();
    next.editions=next.editions.filter(function(x){return x.id!==edId;});
    delete next.rankings[edId];
    if(next.currentEditionId===edId){
      var listed=sortedEditions({editions:next.editions});
      next.currentEditionId=listed[listed.length-1].id;
    }
    commit(next,'Ranking gelöscht');
  });
}

function switchEdition(edId){
  if(edId===STATE.currentEditionId) return;
  if(EDIT&&EDIT.dirty){
    toast('Erst die offene Eingabe speichern oder schliessen.',true);
    return;
  }
  var next=baseNext();
  next.currentEditionId=edId;
  closeEditor();
  commit(next,'Ranking: '+editionLabel(editionById(edId)));
}

/* ---------- Pool: Auswahl ---------- */
function selectRange(rows,fromIx,toIx){
  var a=Math.min(fromIx,toIx), b=Math.max(fromIx,toIx);
  for(var i=a;i<=b;i++) if(rows[i]) UI.sel[rows[i].id]=true;
}
function savePoolAssignments(){
  if(!poolDirty()) return;
  var next=baseNext();
  commit(next,'Zuordnung gespeichert').then(function(ok){
    if(ok) render();
  });
}
function discardPoolAssignments(){
  confirmBox({title:'Zuordnungen verwerfen',
    text:'Alle noch nicht gespeicherten Positions-Zuordnungen gehen verloren.',
    ok:'Verwerfen',danger:true}).then(function(yes){
    if(!yes) return;
    POOLEDIT=null; poolDraftDrop(); clearSel(); render();
    toast('Zuordnungen verworfen');
  });
}

/* ---------- Drag & Drop im Editor ---------- */
var DRAG=null,DROP=null,POOLDRAG=null;
function clearDropMarks(){
  Array.prototype.forEach.call(document.querySelectorAll('#app .row.over'),function(el){el.classList.remove('over');});
}
function applyDrop(){
  if(!EDIT||!DRAG||!DROP) return;
  var src=EDIT.tiers[DRAG.tier];
  if(DRAG.ix<0||DRAG.ix>=src.length) return;
  var item=src[DRAG.ix];
  src.splice(DRAG.ix,1);
  var dst=EDIT.tiers[DROP.tier];
  var idx=DROP.index;
  if(DRAG.tier===DROP.tier&&DRAG.ix<idx) idx--;
  idx=Math.max(0,Math.min(idx,dst.length));
  dst.splice(idx,0,item);
  markDirty();
}

/* ---------- Verdrahtung ---------- */
function wire(){
  var app=$('#app');

  app.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(!t) return;
    var act=t.getAttribute('data-act');

    if(act==='home'){ closeEditor(); UI.tab=UI.me; go('overview'); return; }
    if(act==='nav'){
      var v=t.getAttribute('data-v'); closeEditor();
      go(v==='pool'?'pool':v==='editions'?'editions':'overview'); return;
    }
    if(act==='ed-new'){ newEdition(); return; }
    if(act==='ed-rename'){ renameEdition(t.getAttribute('data-e')); return; }
    if(act==='ed-del'){ deleteEdition(t.getAttribute('data-e')); return; }
    if(act==='ed-open'){ switchEdition(t.getAttribute('data-e')); return; }

    if(act==='scope'){ UI.poolScope=t.getAttribute('data-s'); clearSel(); stashUI(); render(); return; }
    if(act==='amode'){ UI.assignMode=t.getAttribute('data-m'); stashUI(); render(); return; }
    if(act==='posfilter'){
      var pv=t.getAttribute('data-p');
      if(pv==='none'){ UI.poolPos='all'; UI.poolScope='ohne'; }
      else if(pv==='all'){ UI.poolPos='all'; }
      else { UI.poolPos=(UI.poolPos===pv?'all':pv); if(UI.poolScope==='ohne') UI.poolScope='alle'; }
      clearSel(); stashUI(); render(); return;
    }
    if(act==='selall'){ poolFiltered().forEach(function(x){UI.sel[x.id]=true;}); render(); return; }
    if(act==='selnone'){ clearSel(); render(); return; }
    if(act==='assign'){
      var target=t.getAttribute('data-p')||null;
      var ids=selectedIds();
      if(!ids.length){ toast('Zuerst Spieler markieren.',true); return; }
      var n=assignPositions(ids,target,UI.assignMode);
      toast(n+' Spieler '+(target?'→ '+POS_BY_ID[target].name:'ohne Position'));
      render(); return;
    }
    if(act==='unassign'){
      removePosition(t.getAttribute('data-id'),t.getAttribute('data-p'));
      render(); return;
    }
    if(act==='pool-save'){ savePoolAssignments(); return; }
    if(act==='pool-discard'){ discardPoolAssignments(); return; }
    if(act==='cbx'){
      var rw=t.closest('.prow');
      if(rw){ var id=rw.getAttribute('data-id'); UI.sel[id]=!UI.sel[id]; UI.lastSelIx=parseInt(rw.getAttribute('data-ix'),10); render(); }
      return;
    }
    if(act==='me'){
      UI.me=t.getAttribute('data-h');
      try{localStorage.setItem('sst:me',UI.me);}catch(err){}
      if(UI.view==='overview') UI.tab=UI.me;
      stashUI(); render(); return;
    }
    if(act==='open'){ UI.pos=t.getAttribute('data-p'); UI.tab=UI.me; closeEditor(); go('position'); return; }
    if(act==='tab'){ UI.tab=t.getAttribute('data-t'); stashUI(); render(); return; }
    if(act==='edit'){ openEditor(t.getAttribute('data-p'),t.getAttribute('data-h')); UI.tab=t.getAttribute('data-h'); render(); return; }
    if(act==='become'){
      UI.me=t.getAttribute('data-h');
      try{localStorage.setItem('sst:me',UI.me);}catch(err){}
      UI.tab=UI.me; openEditor(t.getAttribute('data-p'),UI.me); stashUI(); render(); return;
    }
    if(act==='cancel'){ closeEditor(); render(); return; }
    if(act==='save'){ doSave(); return; }
    if(act==='delete'){ doDelete(t.getAttribute('data-p'),t.getAttribute('data-h')); return; }
    if(act==='copy'){ copyText(consensusText(t.getAttribute('data-p')),'Konsens-Ranking kopiert'); return; }
    if(act==='copy-sample'){ copyText(SAMPLE_CSV,'Beispiel-CSV kopiert'); return; }
    if(act==='pick-file'){ var f=$('#file'); if(f) f.click(); return; }

    if(act==='wipe-rankings'){
      confirmBox({title:'Alles in „'+editionLabel(currentEdition())+'" löschen',
        text:'Sämtliche Eingaben von Adi und Fabio über alle sieben Positionen werden entfernt. '+
             'Andere Rankings und der Spielerpool bleiben.',
        ok:'Löschen',danger:true})
        .then(function(yes){
          if(!yes) return;
          var next=baseNext();
          next.rankings[STATE.currentEditionId]={};
          POSITIONS.forEach(function(p){HOSTS.forEach(function(h){dropDraft(p.id,h.id);});});
          commit(next,'Eingaben gelöscht');
        });
      return;
    }
    if(act==='wipe-pool'){
      confirmBox({title:'Spielerliste löschen',text:'Der Spielerpool wird komplett geleert, auch die Positions-Zuordnungen. Gespeicherte Rankings bleiben erhalten, ihre Spieler werden aber als „nicht im Pool" markiert.',ok:'Löschen',danger:true})
        .then(function(yes){
          if(!yes) return;
          POOLEDIT=null; poolDraftDrop(); clearSel();
          var next=clone(STATE);
          next.pool={players:[],fileName:null,updatedAt:null,warnings:[],imports:[],lastImportAt:null};
          commit(next,'Spielerliste gelöscht');
        });
      return;
    }

    if(!EDIT) return;
    var row=t.closest('.row');
    if(act==='pick'){ pickIndex(parseInt(t.getAttribute('data-ix'),10)); return; }
    if(!row) return;
    var tier=row.getAttribute('data-tier'), ix=parseInt(row.getAttribute('data-ix'),10);
    var list=EDIT.tiers[tier];

    if(act==='mv'){
      var dir=parseInt(t.getAttribute('data-dir'),10), j=ix+dir;
      if(j<0||j>=list.length) return;
      var tmp=list[ix]; list[ix]=list[j]; list[j]=tmp;
      markDirty(); render(); return;
    }
    if(act==='tmv'){
      var d=parseInt(t.getAttribute('data-dir'),10);
      var ids=TIERS.map(function(x){return x.id;});
      var ti=ids.indexOf(tier)+d;
      if(ti<0||ti>=ids.length) return;
      var moved=list.splice(ix,1)[0];
      EDIT.tiers[ids[ti]].push(moved);
      markDirty(); render(); return;
    }
    if(act==='rm'){ list.splice(ix,1); markDirty(); render(); return; }
  });

  /* Auswahl in der Spielerliste: Klick = einer, Cmd/Ctrl = zusätzlich, Shift = Bereich. */
  app.addEventListener('click',function(e){
    if(UI.view!=='pool') return;
    if(e.target.closest('[data-act]')) return;
    var row=e.target.closest('.prow');
    if(!row) return;
    var rows=poolFiltered().slice(0,400);
    var ix=parseInt(row.getAttribute('data-ix'),10);
    var id=row.getAttribute('data-id');
    if(e.shiftKey&&UI.lastSelIx>=0){ selectRange(rows,UI.lastSelIx,ix); }
    else if(e.metaKey||e.ctrlKey){ UI.sel[id]=!UI.sel[id]; UI.lastSelIx=ix; }
    else {
      var only=Object.keys(UI.sel).length===1&&UI.sel[id];
      clearSel();
      if(!only){ UI.sel[id]=true; UI.lastSelIx=ix; }
    }
    render();
  });

  app.addEventListener('submit',function(e){
    if(!e.target.matches||!e.target.matches('[data-act="key-form"]')) return;
    e.preventDefault();
    var inp=e.target.querySelector('[data-act="key-input"]');
    var v=(inp&&inp.value||'').trim();
    if(!v){ toast('Bitte das Passwort eingeben.',true); return; }
    saveApiKey(v);
    apiFetch().then(function(r){
      if(r.ok&&r.json){
        apiNeedsKey=false; adoptRemote(r.json); startPolling(); render();
        toast('Willkommen zurück');
      }else if(r.status===401){
        saveApiKey(null);
        if(inp){ inp.value=''; inp.focus(); }
        toast('Passwort stimmt nicht.',true);
      }else if(r.status===503){
        apiNeedsKey=false; apiSetupMsg=(r.json&&r.json.message)||''; render();
      }else{
        toast('Server nicht erreichbar.',true);
      }
    }).catch(function(){ toast('Server nicht erreichbar.',true); });
  });

  app.addEventListener('input',function(e){
    var t=e.target;
    if(t.matches('[data-act="q"]')){ if(EDIT) refreshAC(t); return; }
    if(t.matches('[data-act="poolq"]')){ UI.poolQ=t.value; pendingPoolFocus=true; render(); return; }
  });

  app.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches('[data-act="edsel"]')){ switchEdition(t.value); return; }
    if(t.matches('[data-act="poolteam"]')){ UI.poolTeam=t.value; clearSel(); stashUI(); render(); return; }
    if(t.id==='file'){ applyCSV(t.files&&t.files[0]); t.value=''; return; }
  });

  app.addEventListener('keydown',function(e){
    var t=e.target;
    if(!t.matches||!t.matches('[data-act="q"]')) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); if(AC.open&&AC.items.length) pickIndex(AC.sel); return; }
    if(e.key==='Escape'){
      e.preventDefault(); AC.open=false; t.value=''; closeAllAC();
      return;
    }
  });

  document.addEventListener('click',function(e){
    if(!AC.open) return;
    var ad=e.target.closest('.adder');
    if(ad){
      var inp=ad.querySelector('input[data-act="q"]');
      if(inp&&inp.getAttribute('data-tier')===AC.tier) return;  /* eigenes Feld */
    }
    AC.open=false; closeAllAC();
  });
  app.addEventListener('focusin',function(e){
    if(!AC.open) return;
    var t=e.target;
    if(t.matches&&t.matches('[data-act="q"]')&&t.getAttribute('data-tier')!==AC.tier){
      AC.open=false; AC.items=[]; closeAllAC();
    }
  });

  /* Drag & Drop: Zeilen im Editor + CSV auf die Ablagefläche */
  app.addEventListener('dragstart',function(e){
    var prow=e.target.closest&&e.target.closest('.prow');
    if(prow){
      var pid=prow.getAttribute('data-id');
      if(!UI.sel[pid]){ clearSel(); UI.sel[pid]=true; UI.lastSelIx=parseInt(prow.getAttribute('data-ix'),10); render(); }
      POOLDRAG=selectedIds();
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','players'); }catch(err){}
      return;
    }
    var row=e.target.closest&&e.target.closest('.row.drag');
    if(!row||!EDIT) return;
    DRAG={tier:row.getAttribute('data-tier'),ix:parseInt(row.getAttribute('data-ix'),10)};
    row.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','row'); }catch(err){}
  });
  app.addEventListener('dragend',function(){
    DRAG=null;DROP=null;POOLDRAG=null;
    Array.prototype.forEach.call(document.querySelectorAll('#app .bin.hot'),function(el){el.classList.remove('hot');});
    clearDropMarks();
    Array.prototype.forEach.call(document.querySelectorAll('#app .row.dragging'),function(el){el.classList.remove('dragging');});
  });
  app.addEventListener('dragover',function(e){
    var bin=POOLDRAG&&e.target.closest&&e.target.closest('[data-bin]');
    if(bin){
      e.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('#app .bin.hot'),function(el){el.classList.remove('hot');});
      bin.classList.add('hot');
      return;
    }
    var dz=e.target.closest&&e.target.closest('#drop');
    if(dz){ e.preventDefault(); dz.classList.add('hot'); return; }
    if(!DRAG||!EDIT) return;
    var row=e.target.closest('.row.drag');
    var ul=e.target.closest('ul[data-list]');
    if(!row&&!ul) return;
    e.preventDefault();
    clearDropMarks();
    if(row){
      var r=row.getBoundingClientRect();
      var before=e.clientY<r.top+r.height/2;
      DROP={tier:row.getAttribute('data-tier'),index:parseInt(row.getAttribute('data-ix'),10)+(before?0:1)};
      row.classList.add('over');
    }else{
      var tid=ul.getAttribute('data-list');
      DROP={tier:tid,index:EDIT.tiers[tid].length};
    }
  });
  app.addEventListener('dragleave',function(e){
    var dz=e.target.closest&&e.target.closest('#drop');
    if(dz&&!dz.contains(e.relatedTarget)) dz.classList.remove('hot');
  });
  app.addEventListener('drop',function(e){
    var bin=POOLDRAG&&e.target.closest&&e.target.closest('[data-bin]');
    if(bin){
      e.preventDefault();
      var target=bin.getAttribute('data-bin')||null;
      var n=assignPositions(POOLDRAG,target,UI.assignMode);
      toast(n+' Spieler '+(target?'→ '+POS_BY_ID[target].name:'ohne Position'));
      POOLDRAG=null; render();
      return;
    }
    var dz=e.target.closest&&e.target.closest('#drop');
    if(dz){
      e.preventDefault(); dz.classList.remove('hot');
      var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) applyCSV(f);
      return;
    }
    if(!DRAG||!DROP||!EDIT) return;
    e.preventDefault();
    applyDrop();
    DRAG=null;DROP=null;
    render();
  });

  window.addEventListener('beforeunload',function(e){
    if(((EDIT&&EDIT.dirty)||poolDirty())&&!saving&&!leaving){ e.preventDefault(); e.returnValue=''; }
  });
}

/* ============================================================
   Start
   ============================================================ */
function init(){
  if(['overview','position','pool','editions'].indexOf(UI.view)<0) UI.view='overview';
  if(UI.view==='position'&&!POS_BY_ID[UI.pos]) UI.view='overview';
  if(!UI.sel||typeof UI.sel!=='object') UI.sel={};
  if(UI.tab!=='konsens'&&!HOST_BY_ID[UI.tab]) UI.tab=UI.me;
  poolDraftLoad();
  render(); wire();
  detectBackend();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
